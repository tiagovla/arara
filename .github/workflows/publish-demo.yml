name: Publish demo to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - demo/**
      - src/**
      - .github/workflows/publish-demo.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Tectonic
        uses: wtfjoke/setup-tectonic@v4
        with:
          tectonic-version: 0.17.0

      - name: Build and prepare site
        run: |
          tmpdir="$(mktemp -d "$RUNNER_TEMP/arara.XXXXXX")"
          trap 'rm -rf "$tmpdir"' EXIT
          cp demo/demo.tex src/beamerthemearara.sty "$tmpdir/"
          tectonic --outdir "$tmpdir" "$tmpdir/demo.tex"
          mkdir -p _site
          cp "$tmpdir/demo.pdf" _site/arara.pdf
          cp demo/index.html _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
