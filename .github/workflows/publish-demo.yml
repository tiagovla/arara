name: Publish demo to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - demo/**
      - src/**
      - justfile
      - .github/pages/**
      - .github/workflows/publish-demo.yml
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Tectonic
        uses: wtfjoke/setup-tectonic@v4
        with:
          tectonic-version: 0.17.0

      - name: Set up Just
        uses: extractions/setup-just@v3

      - name: Install PDF preview tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick poppler-utils

      - name: Build and prepare site
        run: |
          tmpdir="$(mktemp -d "$RUNNER_TEMP/arara.XXXXXX")"
          trap 'rm -rf "$tmpdir"' EXIT
          just demo demo-dark
          mkdir -p _site
          cp arara.pdf arara-dark.pdf _site/
          cp .github/pages/index.html _site/index.html
          for theme in light dark; do
            pdf=_site/arara.pdf
            [ "$theme" = light ] || pdf=_site/arara-dark.pdf
            pages="$(pdfinfo "$pdf" | awk '/^Pages:/ { print $2 }')"
            if [ "$pages" -lt 4 ]; then
              echo "The $theme demo needs at least four slides to make a preview" >&2
              exit 1
            fi
            middle_one=$(((pages + 1) / 2))
            middle_two=$((middle_one + 1))
            if [ "$middle_two" -ge "$pages" ]; then
              middle_two=$((pages - 1))
            fi
            for point in first middle-one middle-two last; do
              case "$point" in
                first) page=1 ;;
                middle-one) page=$middle_one ;;
                middle-two) page=$middle_two ;;
                last) page=$pages ;;
              esac
              pdftoppm -f "$page" -l "$page" -singlefile -png -scale-to 960 "$pdf" "$tmpdir/$theme-$point"
            done
            montage "$tmpdir/$theme-first.png" "$tmpdir/$theme-middle-one.png" "$tmpdir/$theme-middle-two.png" "$tmpdir/$theme-last.png" \
              -tile 2x2 -geometry 960x540+16+16 -background '#eef2f5' -gravity center \
              "_site/demo-preview-$theme.png"
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Remove superseded Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deployments="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=100" --jq '.[] | "\(.id) \(.sha)"')"
          current_id="$(printf '%s\n' "$deployments" | awk -v sha="$GITHUB_SHA" '$2 == sha { print $1; exit }')"
          if [ -z "$current_id" ]; then
            echo "Could not find the successful Pages deployment for $GITHUB_SHA" >&2
            exit 1
          fi
          while read -r deployment_id sha; do
            [ -n "$deployment_id" ] || continue
            [ "$deployment_id" = "$current_id" ] && continue
            gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
              -f state=inactive \
              -f "description=Superseded by Pages deployment $GITHUB_SHA"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}"
          done <<EOF
          $deployments
          EOF
