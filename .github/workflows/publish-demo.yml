name: Publish demo to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - demo/**
      - src/**
      - .github/pages/**
      - .github/workflows/publish-demo.yml
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Tectonic
        uses: wtfjoke/setup-tectonic@v4
        with:
          tectonic-version: 0.17.0

      - name: Install PDF preview tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick poppler-utils

      - name: Build and prepare site
        run: |
          tmpdir="$(mktemp -d "$RUNNER_TEMP/arara.XXXXXX")"
          trap 'rm -rf "$tmpdir"' EXIT
          cp demo/demo.tex src/beamerthemearara.sty "$tmpdir/"
          tectonic --outdir "$tmpdir" "$tmpdir/demo.tex"
          mkdir -p _site
          cp "$tmpdir/demo.pdf" _site/arara.pdf
          cp .github/pages/index.html _site/index.html
          pages="$(pdfinfo "$tmpdir/demo.pdf" | awk '/^Pages:/ { print $2 }')"
          if [ "$pages" -lt 4 ]; then
            echo "The demo needs at least four slides to make a preview" >&2
            exit 1
          fi
          middle_one=$(((pages + 1) / 2))
          middle_two=$((middle_one + 1))
          if [ "$middle_two" -ge "$pages" ]; then
            middle_two=$((pages - 1))
          fi
          pdftoppm -f 1 -l 1 -singlefile -png -scale-to 960 "$tmpdir/demo.pdf" "$tmpdir/first"
          pdftoppm -f "$middle_one" -l "$middle_one" -singlefile -png -scale-to 960 "$tmpdir/demo.pdf" "$tmpdir/middle-one"
          pdftoppm -f "$middle_two" -l "$middle_two" -singlefile -png -scale-to 960 "$tmpdir/demo.pdf" "$tmpdir/middle-two"
          pdftoppm -f "$pages" -l "$pages" -singlefile -png -scale-to 960 "$tmpdir/demo.pdf" "$tmpdir/last"
          montage "$tmpdir/first.png" "$tmpdir/middle-one.png" "$tmpdir/middle-two.png" "$tmpdir/last.png" \
            -tile 2x2 -geometry 960x540+16+16 -background '#eef2f5' -gravity center \
            _site/demo-preview.png

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Remove superseded Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deployments="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=100" --jq '.[] | "\(.id) \(.sha)"')"
          current_id="$(printf '%s\n' "$deployments" | awk -v sha="$GITHUB_SHA" '$2 == sha { print $1; exit }')"
          if [ -z "$current_id" ]; then
            echo "Could not find the successful Pages deployment for $GITHUB_SHA" >&2
            exit 1
          fi
          while read -r deployment_id sha; do
            [ -n "$deployment_id" ] || continue
            [ "$deployment_id" = "$current_id" ] && continue
            gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
              -f state=inactive \
              -f "description=Superseded by Pages deployment $GITHUB_SHA"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}"
          done <<EOF
          $deployments
          EOF
