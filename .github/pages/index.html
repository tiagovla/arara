<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#174a70" />
    <title>Arara — A living mosaic</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: #122b3a;
        background: #eef2f5;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      main { width: min(1080px, calc(100% - 40px)); margin: 48px auto; }
      header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
      .eyebrow { margin: 0 0 10px; color: #a07b35; font-size: .75rem; font-weight: 750; letter-spacing: .16em; }
      h1 { margin: 0; color: #174a70; font-size: clamp(2rem, 5vw, 3.4rem); letter-spacing: -.045em; }
      .subtitle { margin: 8px 0 0; color: #526a78; }
      a { display: inline-block; flex: none; border-radius: 999px; padding: 12px 18px; color: #fff; background: #174a70; font-weight: 650; text-decoration: none; }
      a:hover { background: #123a59; }
      iframe { display: block; width: 100%; height: min(74vh, 780px); min-height: 420px; border: 1px solid #d7e0e5; border-radius: 18px; background: #fff; box-shadow: 0 20px 60px #122b3a18; }
      @media (max-width: 620px) {
        main { width: min(100% - 24px, 1080px); margin: 24px auto; }
        header { align-items: start; flex-direction: column; }
        iframe { height: 68vh; min-height: 320px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">ARARA / FIELD NOTES 01</p>
          <h1>A living mosaic</h1>
          <p class="subtitle">Biodiversity across Brazil</p>
        </div>
        <a href="arara.pdf" download>Download the PDF</a>
      </header>
      <iframe src="arara.pdf" title="A living mosaic: biodiversity across Brazil"></iframe>
    </main>
  </body>
</html>
