<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#174a70" />
    <title>Arara — A living mosaic</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        --page: #eef2f5;
        --text: #122b3a;
        --muted: #526a78;
        --accent: #174a70;
        --accent-hover: #123a59;
        --card: #f9fbfc;
        --border: #d7e0e5;
        --reader: #fff;
        color: var(--text);
        background: var(--page);
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --page: #08131c;
        --text: #e2eaf0;
        --muted: #a8bac7;
        --accent: #d7b96f;
        --accent-hover: #e2c985;
        --card: #0d1924;
        --border: #314657;
        --reader: #0d1924;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: var(--page); transition: background-color .2s, color .2s; }
      main { width: min(1280px, calc(100% - 40px)); margin: 48px auto; }
      header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
      .eyebrow { margin: 0 0 10px; color: #a07b35; font-size: .75rem; font-weight: 750; letter-spacing: .16em; }
      h1 { margin: 0; color: var(--accent); font-size: clamp(2rem, 5vw, 3.4rem); letter-spacing: -.045em; }
      .subtitle { margin: 8px 0 0; color: var(--muted); }
      .demos { display: grid; grid-template-columns: minmax(0, 1fr); }
      .demo { min-width: 0; padding: 18px; border: 1px solid var(--border); border-radius: 20px; background: var(--card); box-shadow: 0 20px 60px #122b3a12; }
      .demo header { align-items: center; margin-bottom: 14px; }
      h2 { margin: 0; font-size: 1.2rem; }
      a, button { display: inline-block; flex: none; border: 0; border-radius: 999px; padding: 10px 14px; color: #fff; background: var(--accent); font: inherit; font-size: .9rem; font-weight: 650; text-decoration: none; cursor: pointer; }
      a:hover, button:hover { background: var(--accent-hover); }
      :root[data-theme="dark"] a, :root[data-theme="dark"] button { color: #0d1924; }
      iframe { display: block; width: 100%; height: min(68vh, 720px); min-height: 380px; border: 1px solid var(--border); border-radius: 12px; background: var(--reader); color-scheme: light; }
      :root[data-theme="dark"] iframe { color-scheme: dark; }
      @media (max-width: 620px) {
        main { width: min(100% - 24px, 1280px); margin: 24px auto; }
        main > header { align-items: start; flex-direction: column; }
        .demo header { align-items: start; }
        iframe { height: 68vh; min-height: 320px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">ARARA / FIELD NOTES 01</p>
          <h1>A living mosaic</h1>
          <p class="subtitle">Biodiversity across Brazil</p>
        </div>
        <button id="theme-toggle" type="button" aria-pressed="false">Switch to dark</button>
      </header>
      <section class="demos" aria-label="Theme demo">
        <article class="demo">
          <header>
            <h2 id="theme-name">Light</h2>
            <a id="download" href="arara.pdf" download>Download PDF</a>
          </header>
          <iframe id="reader" src="arara.pdf" title="Light theme demo: biodiversity across Brazil"></iframe>
        </article>
      </section>
    </main>
    <script>
      const root = document.documentElement;
      const toggle = document.getElementById("theme-toggle");
      const name = document.getElementById("theme-name");
      const download = document.getElementById("download");
      const reader = document.getElementById("reader");
      const themeColor = document.querySelector('meta[name="theme-color"]');

      toggle.addEventListener("click", () => {
        const dark = root.dataset.theme !== "dark";
        root.dataset.theme = dark ? "dark" : "light";
        toggle.setAttribute("aria-pressed", String(dark));
        toggle.textContent = dark ? "Switch to light" : "Switch to dark";
        themeColor.content = dark ? "#08131c" : "#174a70";
        name.textContent = dark ? "Dark" : "Light";
        const pdf = dark ? "arara-dark.pdf" : "arara.pdf";
        download.href = pdf;
        reader.src = pdf;
        reader.title = `${name.textContent} theme demo: biodiversity across Brazil`;
        reader.style.colorScheme = dark ? "dark" : "light";
      });
    </script>
  </body>
</html>
